name: RUNDINGAN MEDIA CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/media/**"
      - ".github/workflows/media-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/media/**"
      - ".github/workflows/media-ci.yml"

permissions:
  contents: read

concurrency:
  group: media-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/media
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/media/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
